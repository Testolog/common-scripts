[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-client"
version = "0.1.0"
description = "Detached agent supervisor for the Neovim Agentic tabs"
requires-python = ">=3.10"
dependencies = [
  "mcp==1.29.1",
  "python-dotenv",
]

[project.scripts]
agentic-client = "agentic_client.__main__:main"

[tool.setuptools.packages.find]
include = ["agentic_client*"]
